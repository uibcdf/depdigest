[build-system]
requires = ["setuptools>=61.0", "versioningit>=3.0"]
build-backend = "setuptools.build_meta"

[project]
name = "depdigest"
dynamic = ["version"]
description = "Lightweight dependency management and lazy loading for Python libraries."
readme = "README.md"
requires-python = ">=3.11.0,<3.14.0"
license = {text = "MIT"}
authors = [
    {name = "UIBCDF Development Team"}
]
dependencies = [
    "smonitor>=0.13.0",
]

[project.urls]
Homepage = "https://github.com/uibcdf/depdigest"
"Source" = "https://github.com/uibcdf/depdigest/"
"Documentation" = "https://uibcdf.org/depdigest/"

[project.scripts]
depdigest = "depdigest.cli:main"

[tool.setuptools.packages.find]
include = ["depdigest*"]

[tool.ruff]
target-version = "py311"
line-length = 88
# Guides vendored from another repository are excluded: they are synced copies
# of a canonical document, so a local reformat here is reverted by the next sync.
# They are also formatted under their source repository's Ruff configuration,
# which is not this one -- `SMONITOR_GUIDE.md` is `ruff format` clean at
# smonitor's line-length of 100 and not at the 88 configured here, and no single
# version of the file satisfies both. Tracked in uibcdf/molsyssuite#12.
extend-exclude = [
    "GH_RUN_RECEPTOR_GUIDE.md",
    "SMONITOR_GUIDE.md",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"depdigest/_smonitor.py" = ["E402", "F401"]

[tool.versioningit]
default-version = "1+unknown"

[tool.versioningit.format]
distance = "{base_version}+{distance}.{vcs}{rev}"
dirty = "{base_version}+{distance}.{vcs}{rev}.dirty"
distance-dirty = "{base_version}+{distance}.{vcs}{rev}.dirty"

[tool.versioningit.vcs]
# The method key:
method = "git"  # <- The method name
# Parameters to pass to the method:
match = ["*"]
default-tag = "1.0.0"

[tool.versioningit.write]
file = "depdigest/_version.py"
