name: CI Full Matrix

on:
  schedule:
    - cron: "0 9 * * MON"
    - cron: "47 0 * * *"
      timezone: "America/Mexico_City"
  workflow_dispatch:
    inputs:
      probe_backlog:
        description: Check skipped-commit debt without running the matrix
        required: false
        default: false
        type: boolean

jobs:
  nightly-decision:
    name: Check skipped-commit backlog
    if: >-
      (github.event_name == 'schedule' && github.event.schedule == '47 0 * * *')
      || (github.event_name == 'workflow_dispatch' && inputs.probe_backlog == true)
    permissions:
      actions: read
      contents: read
    runs-on: ubuntu-latest
    outputs:
      run_full: ${{ steps.decide.outputs.run_full }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Decide whether to run the full matrix
        id: decide
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python devtools/ci_backlog.py

  full-test:
    name: Full test on ${{ matrix.cfg.os }}, Python ${{ matrix.cfg.python-version }}
    needs: nightly-decision
    if: >-
      always() && inputs.probe_backlog != true
      && (github.event_name != 'schedule' || github.event.schedule != '47 0 * * *'
      || needs.nightly-decision.result != 'success'
      || needs.nightly-decision.outputs.run_full == 'true')
    runs-on: ${{ matrix.cfg.os }}
    timeout-minutes: 90
    concurrency:
      group: ci-full-matrix-${{ github.workflow }}-${{ github.ref }}-${{ matrix.cfg.os }}-${{ matrix.cfg.python-version }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        cfg:
          - { os: ubuntu-latest, python-version: "3.11"}
          - { os: ubuntu-latest, python-version: "3.12"}
          - { os: ubuntu-latest, python-version: "3.13"}
          - { os: ubuntu-latest, python-version: "3.14"}
          - { os: macos-latest,  python-version: "3.11"}
          - { os: macos-latest,  python-version: "3.12"}
          - { os: macos-latest,  python-version: "3.13"}
          - { os: macos-latest,  python-version: "3.14"}
          - { os: windows-latest, python-version: "3.11"}
          - { os: windows-latest, python-version: "3.12"}
          - { os: windows-latest, python-version: "3.13"}
          - { os: windows-latest, python-version: "3.14"}

    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Additional info about the build
      shell: bash
      run: |
        uname -a

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.cfg.python-version }}

    - name: Setup conda env
      uses: mamba-org/setup-micromamba@v3.2.1
      with:
        environment-file: devtools/conda-envs/test_env.yaml
        environment-name: test
        condarc: |
          channels:
            - uibcdf
            - conda-forge
          channel_priority: strict
        create-args: >-
          python=${{ matrix.cfg.python-version }}
        cache-downloads: true

    - name: Info conda
      shell: bash -l {0}
      run: |
        micromamba activate test
        micromamba info
        micromamba list

    - name: Install package
      shell: bash -l {0}
      run: |
        python -m pip install . --no-deps

    - name: Test import module
      shell: bash -l {0}
      run: |
        set -euo pipefail
        echo "::group::Importing module from home directory"
        cd
        pwd
        echo 'import depdigest; print("Version of the package: {}".format(depdigest.__version__))' | python
        echo "::endgroup::"

    - name: Run tests
      shell: bash -l {0}
      run: |
        python -m pytest --receptor=ci -n 4 -v --color=yes
