name: Sphinx docs to gh-pages

on:
  release:
    types: ['released']

  workflow_dispatch:

jobs:
  sphinx_docs_to_gh-pages:
    runs-on: ubuntu-latest
    name: Sphinx docs to gh-pages
    steps:

      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Additional info about the build
        shell: bash
        run: |
          uname -a

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: 3.14

      - name: Setup conda env
        uses: mamba-org/setup-micromamba@v3.2.1
        with:
          environment-file: devtools/conda-envs/docs_env.yaml
          environment-name: docs
          condarc: |
            channels:
              - uibcdf
              - conda-forge
            channel_priority: strict
          create-args: >-
            python=3.14

      - name: Info conda
        shell: bash -l {0}
        run: |
          micromamba activate docs
          micromamba info
          micromamba list

      - name: Checkout the reviewed distribution provider
        uses: actions/checkout@v6
        with:
          repository: uibcdf/molsyssuite
          ref: 6d6172d6cd00c5ac2d4ebadb71df554ec5b7fa26
          path: .suite-tools/molsyssuite
          persist-credentials: false

      - name: Check distribution inputs
        shell: bash -l {0}
        run: python devtools/check_distribution_inputs.py --suite-root .suite-tools/molsyssuite

      - name: Installing the library
        shell: bash -l {0}
        run: |
          python -m pip install . --no-deps

      - name: Test import module
        shell: bash -l {0}
        run: |
          set -euo pipefail
          echo "::group::Importing module from home directory"
          trap 'echo "::endgroup::"' EXIT
          cd
          pwd
          python -c 'import depdigest; print("Version of the package: {}".format(depdigest.__version__))'

      - name: Running the Sphinx to gh-pages Action
        uses: uibcdf/action-sphinx-docs-to-gh-pages@main
