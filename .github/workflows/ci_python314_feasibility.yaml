name: Python 3.14 feasibility (non-claiming)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-tests:
    name: Source feasibility on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Create Python 3.14 test environment from public channels
        uses: mamba-org/setup-micromamba@v3.2.1
        with:
          environment-name: feasibility
          condarc: |
            channels:
              - uibcdf
              - conda-forge
            channel_priority: strict
          create-args: >-
            python=3.14
            smonitor=0.16.0=py_1
            pytest-receptor=1.1.0=py_1
            pytest
            pytest-xdist
            pyyaml
            numpy
            pint

      - name: Record interpreter and dependency provenance
        shell: bash -l {0}
        run: |
          python --version
          micromamba list smonitor
          micromamba list pytest-receptor

      - name: Test checkout source without claiming package support
        shell: bash -l {0}
        run: |
          export PYTHONPATH="$GITHUB_WORKSPACE"
          python -m pytest --receptor=llm -n 4
