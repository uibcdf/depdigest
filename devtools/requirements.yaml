setup:
  channels: &setup_channels
    - uibcdf
    - conda-forge
  dependencies: &setup_dependencies
    - python >=3.11,<3.15
    - pip
    - setuptools >=61.0
    - versioningit >=3.0

production:
  channels: &production_channels
    - *setup_channels
  dependencies: &production_dependencies
    - python >=3.11,<3.15
    - &runtime_dependencies
      - smonitor >=0.13.0

test:
  channels: &test_channels
    - *production_channels
  dependencies: &test_dependencies
    - *production_dependencies
    - &test_tools
      - pytest
      - pytest-cov
      - pytest-xdist
      - pytest-receptor =1.1.0
      - pyyaml
      - jinja2
      - packaging
      - codecov

docs:
  channels: &docs_channels
    - *production_channels
  dependencies: &docs_dependencies
    - *production_dependencies
    - &docs_tools
      - sphinx
      - pydata-sphinx-theme
      - sphinxcontrib-bibtex
      - sphinx-remove-toctrees
      - sphinx-copybutton
      - sphinx-design
      - sphinx-favicon
      - sphinx-tabs
      - myst-nb
      - pyyaml
      - jinja2
      - packaging


development:
  channels:
    - *production_channels
  dependencies:
    - *runtime_dependencies
    - *test_tools
    - *docs_tools
    - python =3.14
    - ruff =0.16.5
    - mamba

conda-build:
  channels:
    - *setup_channels
  dependencies:
    - *setup_dependencies
    - anaconda-client
    - conda-build
